# Every generator that shares one environment (NumPy 2): install the extras `metasyn`, `pybnesian`, `mostlyai`, `statsmodels`,
# `privacy` and `umap`. The pipeline is the one of demo_config.toml. Add `dp_cgans` or `privbayes` models as in
# sphinx/backends.md; SynthCity needs NumPy 1 and has its own bundle, synthcity_config.toml.
[pipeline]
generate_umap = true
compute_privacy = true
compute_downstream = true
compute_joint = true
compute_baselines = true
compute_utility = true
cv_folds = 5
enable_missingness_wrapping = true

[[models]]
name = "metasyn"
backend = "metasyn"

[[models]]
name = "chain"
backend = "chain"
seed = 42

[[models]]
name = "clg_mi3"
backend = "pybnesian"
seed = 42
[models.model]
type = "clg"
score = "bic"
operators = ["arcs"]
max_indegree = 3

[[models]]
name = "semi_mi5"
backend = "pybnesian"
seed = 42
[models.model]
type = "semiparametric"
score = "bic"
operators = ["arcs"]
max_indegree = 5

[[models]]
name = "mostlyai"
backend = "mostlyai"
seed = 42
[models.model]
max_epochs = 50
max_training_time = 10
