# The quick start: two generators that need little (MetaSyn needs the `metasyn` extra, chain needs none), with the privacy and
# downstream checks on. One split of the data; see demo_config.toml for the cross-validated evaluation.
[pipeline]
generate_umap = true
max_umap_sample = 256
compute_privacy = true
compute_downstream = true
enable_missingness_wrapping = false

[[models]]
name = "metasyn"
backend = "metasyn"

[[models]]
name = "chain"
backend = "chain"
seed = 42
