[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semsynth"
version = "0.1.0"
description = "Synthetic data profiling and reporting for OpenML and UCI datasets."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "SemSynth Authors" }
]
keywords = ["synthetic-data", "data-profiling", "metadata", "uci"]
dependencies = [
  "defopt",
  "flask",
  "markdown",
  "jinja2",
  "numpy<2",
  "openml",
  "pandas<3",
  "linked-codebook @ https://bennokr.github.io/linked-codebook/linked_codebook-0.7.0-py3-none-any.whl",
  "makeprov>=0.4.4",
  "pyarrow<26",  # 26.0 requires NumPy 2; numpy<2 above
  "tabulate",
  "requests",
  "scikit-learn",
  "ucimlrepo"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff>=0.17,<0.18",
  "mypy",
  "pandas-stubs",
  "ty",
  "statsmodels"
]
app = [
  "flask"
]
docs = [
  "sphinx",
  "myst-parser",
  "myst-nb",
  "sphinx-rtd-theme",
  "statsmodels",
  "linkify-it-py",
]
metasyn = [
  "metasyn"
]
pybnesian = [
  "graphviz",
  "networkx",
  "pybnesian"
]
synthcity = [
  "synthcity>=0.2",
  "torch"
]
privbayes = [
  "DataSynthesizer==0.1.13",
  "scipy"
]
umap = [
  "numba<0.63",
  "llvmlite<0.46",
  "matplotlib",
  "umap-learn"
]
statsmodels = [
  "statsmodels"
]
mapping = [
  "requests",
  "defopt",
  "datasette",
  "sqlite-utils",
  "sssom"
]
all = [
  "metasyn",
  "statsmodels",
  "graphviz",
  "networkx",
  "pybnesian",
  "synthcity>=0.2",
  "torch",
  "DataSynthesizer==0.1.13",
  "scipy",
  "matplotlib",
  "umap-learn"
]

[project.scripts]
semsynth = "semsynth.__main__:main"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["semsynth*", "map_columns*"]

[tool.setuptools.package-data]
semsynth = ["templates/*.j2", "templates/*.html", "templates/*.css", "templates/*.js", "templates/*.rq"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "C90", "PLR09", "ARG", "RUF", "PERF", "ERA"]
ignore = [
  "B008",  # makeprov and defopt take InPath/OutPath calls as parameter defaults
  # Ratchet: these hold today's backlog. Remove one at a time as the modules are split (see the plan in AGENTS.md).
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
  "ARG001", "ARG002", "ARG004", "ARG005",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR09"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
