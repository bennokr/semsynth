[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semsynth"
version = "0.1.0"
description = "Synthetic data profiling and reporting for OpenML and UCI datasets."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "SemSynth Authors" }
]
keywords = ["synthetic-data", "data-profiling", "metadata", "uci"]
dependencies = [
  # Heavy libraries (pyarrow, scikit-learn, jinja2, markdown) are imported when a feature needs them, not at
  # `import semsynth`; see tests/test_lazy_imports.py. Anything else goes into a named extra below.
  "defopt",
  "markdown",
  "jinja2",
  "numpy>=1.26",
  "pandas>=2.1,<3",
  "linked-codebook>=0.11,<0.12",  # 0.11 has IRIs for the extension terms and reads a pandas NaN as blank
  "makeprov>=0.8.1",  # 0.7 moved the script to prov:Plan and made a missing output an error; 0.8 added record_environment and stream
  "pyarrow>=15",
  "tabulate",  # pandas.DataFrame.to_markdown, used by report_tables.py
  "scikit-learn",
  "scipy",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff>=0.17,<0.18",
  "mypy",
  "pandas-stubs",
  "ty",
  "statsmodels",
  "rdflib"
]
app = [
  "flask"  # `python -m semsynth run-app`
]
providers = [
  "openml",
  "requests",
  "ucimlrepo"  # load and list datasets from OpenML and the UCI ML Repository
]
docs = [
  "openml",
  "requests",
  "ucimlrepo",
  "sphinx",
  "myst-parser",
  "myst-nb",
  "sphinx-rtd-theme",
  "statsmodels",
  "linkify-it-py",
  "matplotlib",  # the notebooks plot with it; the umap extra used to bring it in
]
metasyn = [
  "metasyn"
]
language = [
  "py3langid"  # detects the language of text columns; needs NumPy 2 and linked-codebook 0.10 or later
]
pybnesian = [
  "numpy>=2",  # tested on NumPy 2; pyarrow 26 needs it too but does not declare it, so say it here
  "graphviz",
  "pybnesian"
]
synthcity = [
  # The one engine that still needs NumPy 1 (synthcity 0.2.12 requires numpy<2). It conflicts with the extras that
  # need NumPy 2 (see [tool.uv] conflicts), so install it in its own environment.
  "numpy<2",
  "pyarrow<26",  # pyarrow 26 needs NumPy 2; pip would take it and fail on import
  "synthcity>=0.2",
  "torch"
]
mostlyai = [
  "mostlyai-engine>=2.7"  # TabularARGN; needs PyTorch (a CPU build is enough) and NumPy 2; not for Pyodide
]
dp_cgans = [
  "dp-cgans>=0.3"  # conditional GAN with optional DP-SGD; needs PyTorch (a CPU build is enough) and NumPy 2; depends on copulas (BUSL-1.1); not for Pyodide
]
privbayes = [
  "DataSynthesizer==0.1.13",
  "scipy"
]
umap = [
  "numpy>=2",  # umap-learn 0.6 needs it; pyarrow 26 needs it too but does not declare it
  "matplotlib",
  "umap-learn"
]
statsmodels = [
  "statsmodels"
]
privacy = [
  "sdmetrics>=0.33"  # attribute-inference and distance-to-closest-record privacy metrics; needs NumPy 2
]
mapping = [
  "entailmap[lexical] @ git+https://github.com/bennokr/entailmap@1dba493",  # until entailmap is released
]
all = [
  "flask",
  "openml",
  "requests",
  "ucimlrepo",
  "metasyn",
  "statsmodels",
  "graphviz",
  "pybnesian",
  "py3langid",
  "DataSynthesizer==0.1.13",
  "scipy",
  "matplotlib",
  "umap-learn",
  "sdmetrics>=0.33"
]

[tool.uv]
# entailmap 0.1.0 pins linked-codebook 0.10.0. Its use of the library is unchanged in 0.11, so the pin is overridden until entailmap
# releases a version that allows 0.11.
override-dependencies = ["linked-codebook>=0.11,<0.12"]
# synthcity needs NumPy 1, the other engines NumPy 2: uv resolves them as separate forks instead of failing.
conflicts = [
  [{ extra = "synthcity" }, { extra = "pybnesian" }],
  [{ extra = "synthcity" }, { extra = "umap" }],
  [{ extra = "synthcity" }, { extra = "language" }],
  [{ extra = "synthcity" }, { extra = "privacy" }],
  [{ extra = "synthcity" }, { extra = "mostlyai" }],
  [{ extra = "synthcity" }, { extra = "dp_cgans" }],
  [{ extra = "synthcity" }, { extra = "all" }],
]

[project.scripts]
semsynth = "semsynth.__main__:main"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["semsynth*"]

[tool.setuptools.package-data]
semsynth = ["templates/*.j2", "templates/*.html", "templates/*.css", "templates/*.rq"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "C90", "PLR09", "ARG", "RUF", "PERF", "ERA"]
ignore = [
  "B008",  # makeprov and defopt take InPath/OutPath calls as parameter defaults
  "PLR0913", "PLR0917",  # argument counts: the CLI mirrors the pipeline options; shrink with the options
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR09"]
# Ratchet: the modules that are not split yet. Delete a line when its module is fixed; never add one.
"semsynth/privacy_metrics.py" = ["C901", "PLR0912", "PLR0915", "ARG001"]
"semsynth/dataproviders/uciml.py" = ["C901", "PLR0912", "PLR0915"]
"semsynth/dataproviders/_helpers.py" = ["C901"]
"semsynth/dataproviders/openml.py" = ["PLR0915", "ARG001"]
"semsynth/jsonld_to_rdfa.py" = ["PLR0911"]
"semsynth/downstream_fidelity.py" = ["ARG001"]
"semsynth/utils.py" = ["ARG001"]
"semsynth/metrics.py" = ["ARG001"]
"semsynth/catalog.py" = ["ARG001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
