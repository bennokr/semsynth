name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - name: Install from the lock file
        run: uv sync --locked --python 3.11 --extra dev --extra privbayes --extra metasyn --extra statsmodels
      - run: uv run make check

  ty:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --extra dev --extra privbayes --extra metasyn --extra statsmodels
      - run: uv run make ty
