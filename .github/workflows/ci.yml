name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - name: Install from the lock file
        run: uv sync --locked --python 3.11 --extra dev --extra privbayes --extra metasyn --extra statsmodels
      - run: uv run make check

  ty:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --extra dev --extra privbayes --extra metasyn --extra statsmodels
      - run: uv run make ty

  pyodide-versions:
    # The core on the package versions that Pyodide 0.27.7 ships (numpy 2), without the extras that need numpy < 2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 /tmp/env
      - run: |
          . /tmp/env/bin/activate
          uv pip install -c constraints/pyodide-0.27.txt numpy pandas scipy scikit-learn statsmodels pyarrow polars \
            jinja2 markdown pyyaml requests flask defopt makeprov tabulate pytest \
            "DataSynthesizer==0.1.13" "metasyn==3.0.0" \
            https://bennokr.github.io/linked-codebook/linked_codebook-0.7.0-py3-none-any.whl
          uv pip install --no-deps -e .
          pytest -q --ignore=tests/test_sparql_playwright.py
