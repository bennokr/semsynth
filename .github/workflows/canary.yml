name: canary

# Installs the newest version of every dependency each week and runs the checks, so that a release such as
# ruff 0.16 or pyarrow 26 shows up as an issue on the day it breaks us, not during an unrelated push.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade -e '.[dev,privbayes,metasyn,statsmodels]'
      - id: check
        run: make check
        continue-on-error: true
      - name: Open an issue if the checks fail
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Canary: checks fail with the newest dependencies" \
            --body "The weekly run with unpinned dependencies failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  engines:
    # PyBNesian (NumPy 2) and SynthCity (NumPy 1, and PyTorch: several gigabytes) cannot share an environment.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pybnesian, synthcity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade -e '.[dev,${{ matrix.engine }}]'
      - id: engines
        run: python -m pytest -q tests/test_engines.py
        continue-on-error: true
      - name: Open an issue if an engine fails
        if: steps.engines.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Canary: the ${{ matrix.engine }} engine fails" \
            --body "The weekly engine tests failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
