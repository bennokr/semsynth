name: Verify synthesis contract

on:
  push:
    branches:
      - codex/synthesis-result-privbayes

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,privbayes]"
      - run: python -m pytest -q tests/test_result.py tests/test_privbayes_semantics.py
