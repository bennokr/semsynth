name: Verify synthesis contract

on:
  push:
    branches:
      - codex/synthesis-result-privbayes
    paths:
      - .github/workflows/verify-synthesis-contract.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,privbayes]"
      - run: python -m pytest -q
