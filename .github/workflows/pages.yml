name: pages

# Publishes the site: the documentation, the SPARQL explorer and the reports of the demo datasets.
#
# The reports take hours to build, so they are not built here. They are built by hand (`make site`), uploaded to a release as
# semsynth-site.tar.gz with its .sha256, and pulled in by this workflow, which checks them and builds everything around them.
# Nothing it builds is committed.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release that holds the built reports (empty: the latest release)'
        default: ''

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Fetch the built reports from the release
        # gh is on the runner. Without a tag it takes the latest release. The bundle is unpacked only if it matches its
        # checksum and holds nothing but output/, downloads-cache/ and its manifest (scripts/site_bundle.py).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p _release
          if ! gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --dir _release \
              --pattern semsynth-site.tar.gz --pattern semsynth-site.tar.gz.sha256; then
            echo "::error::No release has the built reports. Build them with 'make site' and upload dist-site/semsynth-site.tar.gz and its .sha256 to a release."
            exit 1
          fi
          python scripts/site_bundle.py unpack _release/semsynth-site.tar.gz --dest .
          python scripts/check_output.py output
          {
            echo "### Reports"
            echo '```json'
            cat site-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install
        # What the documentation notebooks import: the docs extra (it holds matplotlib and statsmodels).
        run: python -m pip install -e '.[docs]'
      - name: Documentation
        # A notebook that fails to run fails the build (nb_execution_raise_on_error in sphinx/conf.py). The doctrees (a pickle)
        # stay outside the site.
        run: sphinx-build -b html -d _doctrees sphinx _site/docs
      - name: Assemble the site
        run: |
          mkdir -p _site/templates
          cp index.html site-manifest.json _site/
          cp -r output _site/output
          cp semsynth/templates/*.css _site/templates/
      - name: SPARQL explorer
        # The playground (Comunica and YASGUI in the browser, no server) over the RDF files of the output and queries/.
        # It merges its sources into one graph in the browser, so a triple that two files state is returned once. The list
        # is the RDF files only: tests/test_catalog.py checks that no JSON-LD file is missing from it and no other file is in it.
        # Pinned to a commit: the action and its bundled assets move together.
        uses: bennokr/data-catalog-sparql-playground@b083e60f3552f41e823de89c14b5829044bca489
        with:
          data: |
            output/catalog.json
            output/*/dataset.codebook.jsonld
            output/*/models/*/provenance.json
            output/provenance/*.json
          queries: queries/*.rq
          output: _site/explore
          title: SemSynth explorer
          tagline: Query the datasets, codebooks and provenance of the demo with SPARQL.
      - name: Check the site
        # Nothing that loads code may be published: not a pickle of a model, not one of Sphinx.
        run: |
          if find _site \( -name '*.pickle' -o -name '*.pkl' \) | grep -q .; then
            echo "::error::the site would publish a pickle:"
            find _site \( -name '*.pickle' -o -name '*.pkl' \)
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
