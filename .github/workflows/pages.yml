name: pages

# Builds the site (demo reports for the curated datasets, the catalog and the Sphinx documentation)
# and publishes it on GitHub Pages. Nothing it builds is committed.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      config:
        description: Model bundle for the demo reports
        default: configs/demo_config.toml

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Graphviz
        run: sudo apt-get install -y --no-install-recommends graphviz
      - name: Install
        run: python -m pip install -e '.[docs,providers,metasyn,pybnesian,umap,statsmodels,privacy,rdf]'
      - name: Cache downloaded datasets
        uses: actions/cache@v4
        with:
          path: |
            downloads-cache
            uciml-cache
          key: datasets-${{ hashFiles('mappings/*.metadata.json') }}
          restore-keys: datasets-
      - name: Demo reports and catalog
        run: python -m semsynth --conf @prov-config.toml mappings --pipeline-configs "${{ inputs.config || 'configs/demo_config.toml' }}" --outdir output/
      - name: Check that the privacy metrics were computed
        # A skipped metric (a missing extra) is recorded, not raised, so check the output.
        run: |
          python - <<'PY'
          import json, pathlib
          files = sorted(pathlib.Path("output").glob("*/models/*/metrics.privacy.json"))
          bad = [str(f) for f in files if json.loads(f.read_text()).get("status", "ok") != "ok"]
          assert files, "no privacy metrics in the demo output"
          assert list(pathlib.Path("output").glob("*/models/*/metrics.baselines.json")), "no baselines in the demo output"
          assert not bad, f"privacy metrics skipped or failed: {bad}"
          PY
      - name: Documentation
        run: sphinx-build -b html sphinx _site/docs
      - name: Assemble the site
        run: |
          mkdir -p _site/templates
          cp index.html _site/
          cp -r output _site/output
          cp semsynth/templates/*.css _site/templates/
      - name: SPARQL explorer
        # The playground (Comunica and YASGUI in the browser, no server) over the merged RDF of the output and queries/.
        # Pinned to a commit: the action and its bundled assets move together.
        uses: bennokr/data-catalog-sparql-playground@79433855d547595b3d042cad82df121c2e6b6fa1
        with:
          data: output/semsynth.ttl
          queries: queries/*.rq
          output: _site/explore
          title: SemSynth explorer
          tagline: Query the datasets, codebooks and provenance of the demo with SPARQL.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
